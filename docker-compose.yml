services:
  db:
    image: postgres:17-alpine
    container_name: vesta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vesta_user
      POSTGRES_PASSWORD: vesta_password
      POSTGRES_DB: vesta-db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vesta_user -d vesta-db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
