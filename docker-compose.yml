services:
  db:
    image: postgres:17-alpine
    container_name: vesta-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vesta_user
      POSTGRES_PASSWORD: vesta_password
      POSTGRES_DB: vesta_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
